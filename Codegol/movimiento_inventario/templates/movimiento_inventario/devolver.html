<form method="post" action="{% url 'crear_devolucion' salida.id_movimiento %}">
    {% csrf_token %}
    <div class="modal-header text-white" style="background-color: #001f3f;">
        <h5>Registrar devolución</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
    </div>

    <div class="modal-body">
        <label class="fw-bold">Artículo:</label>
        <input type="text" class="form-control mb-3" value="{{ salida.inventario.nombre_articulo }}" disabled>

        <div class="row">
            <div class="col-6">
                <label>Restante:</label>
                <input type="number" class="form-control" value="{{ restante }}" disabled>
            </div>
            <div class="col-6">
                <label>Cantidad a devolver:</label>
                <!-- EL ATRIBUTO MAX ES LA CLAVE -->
                <input type="number" name="cantidad" class="form-control" 
                       value="{{ restante }}" min="1" max="{{ restante }}" required>
            </div>
        </div>

        <div class="mt-3">
            <label>Observación:</label>
            <textarea name="observaciones" class="form-control" 
                      placeholder="Obligatoria si no devuelve todo"></textarea>
        </div>
    </div>

    <div class="modal-footer">
        <button type="submit" class="btn btn-success" style="background-color: #001f3f;">
            Registrar devolución
        </button>
    </div>
</form>
