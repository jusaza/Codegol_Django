<div class="login-box" role="main">

  <h1 style="text-align:center;">Registrar Matrícula</h1>

  <form method="POST"
        style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;">

    {% csrf_token %}

    <div style="display:flex; flex-direction:column;">
      <label>Jugador:</label>
      <select name="id_jugador" required>
        <option value="">Seleccione un jugador</option>
        {% for u in usuarios %}
          <option value="{{ u.id_usuario }}">{{ u.nombre_completo }}</option>
        {% endfor %}
      </select>
    </div>

    <div style="display:flex; flex-direction:column;">
      <label>Fecha Inicio:</label>
      <input type="date" name="fecha_inicio" required>
    </div>

   
    <div style="display:flex; flex-direction:column;">
      <label>Fecha Fin:</label>
      <input type="date" name="fecha_fin" required>
    </div>

    <div style="display:flex; flex-direction:column;">
      <label>Nivel:</label>
      <select name="nivel" required>
        <option value="Alto">Alto</option>
        <option value="Medio">Medio</option>
        <option value="Bajo">Bajo</option>
      </select>
    </div>

    
    <div style="display:flex; flex-direction:column;">
      <label>Observaciones:</label>
      <input type="text" name="observaciones">
    </div>

<div style="display:flex; flex-direction:column;">
  <label>Posición:</label>

  <select name="posicion" required>
    
    {% if posiciones %}
        <option value="">Seleccione una posición</option>

        {% for p in posiciones %}
            <option value="{{ p.id_posicion }}">
                {{ p.nombre }}
            </option>
        {% endfor %}

    {% else %}
        <option value="" disabled selected>
            Primero registra una posición
        </option>
    {% endif %}

  </select>
</div>

    {% if error %}
      <p style="color:red; grid-column: 1 / -1; text-align:center;">{{ error }}</p>
    {% endif %}

    <div style="grid-column: 1 / -1; display:flex; justify-content:center; gap:10px; margin-top:20px;">

  <button type="submit"
          style="background:#0b1649; color:white; padding:10px 25px; border:none; border-radius:8px; cursor:pointer; width:140px;">
    Guardar
  </button>

</div>
