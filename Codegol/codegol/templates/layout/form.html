{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Escuela de Fútbol Pinze{% endblock %}</title>

  {% block extra_css %}
  {% endblock %}
</head>

  {% block extra_js %}
  {% endblock %}
  
<body>

  <header>
    <a href="
        {% if request.path == '/login/' %}
            {% url 'inicio' %}
        {% else %}
            {{ request.META.HTTP_REFERER|default:'/' }}
        {% endif %}" 
        class="logo" aria-label="Logo Escuela de Fútbol Pinze">
      <img src="{% static 'imagenes/logo.jpg' %}" alt="Logo Escuela de Fútbol Pinze" />
    </a>
    <a href="
        {% if request.path == '/login/' %}
            {% url 'inicio' %}
        {% else %}
            {{ request.META.HTTP_REFERER|default:'/' }}
        {% endif %}
        " class="volver">
    Volver
    </a>
  </header>
{% block content %}
{% endblock %}
  </body>
</html>
