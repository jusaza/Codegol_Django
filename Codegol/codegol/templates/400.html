<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso no autorizado</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .container {
            text-align: center;
            background: rgba(0, 0, 0, 0.5);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 80px;
            margin: 0;
        }

        h2 {
            margin: 10px 0;
        }

        p {
            margin: 20px 0;
            font-size: 18px;
        }

        a {
            display: inline-block;
            padding: 12px 25px;
            background: #00c6ff;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: 0.3s;
        }

        a:hover {
            background: #0072ff;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>400</h1>
        <h2>Acceso no autorizado</h2>
        <p>No tienes permisos para acceder a esta página.</p>
        <a href="/">Volver al inicio</a>
    </div>

</body>
</html>
